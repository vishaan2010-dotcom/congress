name: Legislative Metadata Audit

on:
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail on warnings (not just critical errors)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      max_files:
        description: 'Max files to audit (leave blank for all)'
        required: false
        default: ''
  push:
    paths:
      - 'data/**/*.xml'
  pull_request:
    paths:
      - 'data/**/*.xml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC — catches upstream data updates

jobs:
  audit:
    name: Audit Legislative XML Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # No external deps required — stdlib only

      - name: Run Metadata Audit
        run: |
          ARGS="--data-dir ./data --report-out audit_report.json"
          if [ "${{ github.event.inputs.strict_mode }}" = "true" ]; then
            ARGS="$ARGS --strict"
          fi
          if [ -n "${{ github.event.inputs.max_files }}" ]; then
            ARGS="$ARGS --max-files ${{ github.event.inputs.max_files }}"
          fi
          python audit_bot.py $ARGS

      - name: Upload Audit Report
        if: always()  # Upload even if audit fails — for debugging
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_number }}
          path: audit_report.json
          retention-days: 30

      - name: Comment PR with Audit Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit_report.json', 'utf8'));
            const s = report.summary;
            const body = [
              '## 🏛️ Legislative Metadata Audit',
              '',
              `| | Count |`,
              `|---|---|`,
              `| ✅ Passed | ${s.passed} |`,
              `| ⚠️ Warnings | ${s.warnings} |`,
              `| 🚨 Critical | ${s.critical} |`,
              `| 📋 Total Files | ${s.total_files} |`,
              '',
              '_Full report available in the Actions artifacts tab._'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });