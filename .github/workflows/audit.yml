name: Legislative Metadata Audit

on:
  push:
    paths:
      - 'data/**/*.xml'
  pull_request:
    paths:
      - 'data/**/*.xml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run AI Metadata Audit
        run: python audit_bot.py